services:
  postgres:
    image: postgres:16-alpine
    container_name: cineva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cineva
      POSTGRES_PASSWORD: cineva_local_password
      POSTGRES_DB: cineva
    ports:
      - "5432:5432"
    volumes:
      - cineva_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineva -d cineva"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cineva_postgres_data:
